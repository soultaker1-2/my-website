<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Soul Program</title>
    <link rel="stylesheet" href="style1.css?v=4" />
  </head>
  <body>
    <header>
      <a href="portfolio.html" class="logo">SOUL <span>PROGRAM</span></a>
      <nav>
        <a href="portfolio.html#home">Home</a>
        <a href="portfolio.html#about">About</a>
        <a href="portfolio.html#work">Work</a>
        <a href="video.html">Videos</a>
        <a href="educatio.html">Education</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" class="active">Login</a>
      </nav>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation menu" aria-expanded="false">&#9776;</button>
    </header>

    <main>
      <section class="login-page">
        <div class="login-panel">
          <p class="eyebrow">Member access</p>
          <h1>Welcome <span>back</span></h1>
          <p>Sign in to continue to your Soul Program account.</p>
          <form class="login-form" id="loginForm">
            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" name="email" autocomplete="email" required />
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" autocomplete="current-password" required />
            <button type="submit">Sign in</button>
          </form>
          <p class="login-note" id="loginMessage" role="status" aria-live="polite">Authentication will be connected to your user provider.</p>
        </div>
      </section>
    </main>

    <script src="jss.js?v=4"></script>
  </body>
</html>
