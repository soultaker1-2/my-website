<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Critical for mobile screen scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soul Program | Access</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d0d11;
      margin: 0;
      padding: 20px; /* Prevents card from touching screen edges on mobile */
      color: #e0e0e0;
    }

    .card {
      background: #14141c;
      padding: 30px 24px;
      border-radius: 12px;
      border: 1px solid #2a1a24;
      box-shadow: 0 0 25px rgba(220, 20, 60, 0.15);
      
      /* Responsive sizing logic */
      width: 100%;
      max-width: 380px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 22px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #a0a0b0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px; /* Increased tap target for mobile touchscreens */
      background: #09090d;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      color: #ffffff;
      
      /* Minimum 16px font-size prevents iOS Safari from auto-zooming on focus */
      font-size: 16px;
      
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #ff2a4b;
      box-shadow: 0 0 8px rgba(255, 42, 75, 0.4);
    }

    button {
      width: 100%;
      padding: 14px; /* Slightly taller button for easier touch interaction */
      background: linear-gradient(135deg, #ff2a4b 0%, #b30024 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .toggle {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #808090;
    }

    .toggle a {
      color: #ff2a4b;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      margin-left: 4px;
      display: inline-block;
      padding: 4px 0; /* Expanded touch zone for links */
    }

    .toggle a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #ff4d6d;
    }

    /* Screen adjustments for small mobile devices */
    @media (max-width: 480px) {
      .card {
        padding: 24px 18px;
        border-radius: 10px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <form id="loginForm">
    action="portfolio.html"
    method="GET"
    <h2>Welcome back</h2>
    <div class="form-group">
      <label for="loginEmail">Email address</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
    </div>
    <button type="submit">Sign In</button>
    <div class="toggle">
      Don't have an account? <a id="showSignup">Sign Up</a>
    </div>
  </form>

  <form id="signupForm" class="hidden">
    <h2>Create Account</h2>
    <div class="form-group">
      <label for="signupEmail">Email address</label>
      <input type="email" id="signupEmail" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="••••••••" required>
    </div>
    <button type="submit">Register</button>
    <div class="toggle">
      Already have an account? <a id="showLogin">Sign In</a>
    </div>
  </form>

  <div id="statusMessage" class="message"></div>
</div>

<script src="app.js"></script>
</body>
</html>
